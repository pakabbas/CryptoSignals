services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crypto_signals
      MYSQL_USER: cryptouser
      MYSQL_PASSWORD: cryptopass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: change-me-docker
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: cryptouser
      MYSQL_PASSWORD: cryptopass
      MYSQL_DATABASE: crypto_signals
      ENABLE_SCHEDULER: "false"
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
