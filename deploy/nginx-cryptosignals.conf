server {
    listen 80;
    listen [::]:80;
    server_name cryptosignals.btkdeals.com;

    location /.well-known/acme-challenge/ {
        root /var/www/cryptosignals/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cryptosignals.btkdeals.com;

    ssl_certificate /etc/letsencrypt/live/cryptosignals.btkdeals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cryptosignals.btkdeals.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/cryptosignals/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\.(env|git|ht) {
        deny all;
    }
}
