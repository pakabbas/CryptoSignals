{% extends "base.html" %}
{% block title %}SMTP Settings · Crypto Signal Bot{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">SMTP settings</h1>
  <form method="post" action="{{ url_for('settings.smtp_test') }}">
    <button type="submit" class="btn btn-outline-secondary btn-sm">Send test email</button>
  </form>
</div>

<form method="post" class="card shadow-sm">
  <div class="card-body row g-3">
    <div class="col-md-8">
      <label class="form-label">SMTP server</label>
      <input type="text" name="smtp_server" class="form-control" value="{{ smtp.smtp_server }}">
    </div>
    <div class="col-md-4">
      <label class="form-label">Port</label>
      <input type="number" name="smtp_port" class="form-control" value="{{ smtp.smtp_port }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" value="{{ smtp.username }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" value="{{ smtp.password }}">
    </div>
    <div class="col-md-6">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="use_tls" id="use_tls" {% if smtp.use_tls %}checked{% endif %}>
        <label class="form-check-label" for="use_tls">Use TLS</label>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="use_ssl" id="use_ssl" {% if smtp.use_ssl %}checked{% endif %}>
        <label class="form-check-label" for="use_ssl">Use SSL</label>
      </div>
    </div>
    <div class="col-md-6">
      <label class="form-label">Sender email</label>
      <input type="email" name="sender_email" class="form-control" value="{{ smtp.sender_email }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Receiver email</label>
      <input type="email" name="receiver_email" class="form-control" value="{{ smtp.receiver_email }}">
    </div>
    <div class="col-12">
      <label class="form-label">Subject template</label>
      <input type="text" name="subject_template" class="form-control" value="{{ smtp.subject_template }}">
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Save SMTP settings</button>
    </div>
  </div>
</form>
{% endblock %}
