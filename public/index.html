<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CryptoSignals</title>
  <style>
    :root {
      --bg: #0b1220;
      --fg: #e8eef8;
      --muted: #93a4c0;
      --accent: #3dd6c6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse at 20% 10%, #16324f 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #1a3a2e 0%, transparent 45%),
        var(--bg);
    }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.03em;
    }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.35rem 0.75rem;
      border: 1px solid #2a3d5c;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Crypto<span>Signals</span></h1>
    <p>Deploy pipeline is live. Trade alert email bot coming next.</p>
    <div class="badge">CI/CD OK · cryptosignals.btkdeals.com</div>
  </main>
</body>
</html>
