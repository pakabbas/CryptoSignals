name: Clear signals

on:
  workflow_dispatch:

concurrency:
  group: clear-signals
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync clear script and run on VM
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/clear_signals.py \
            "$SSH_USER@$SSH_HOST:/var/www/cryptosignals/deploy/clear_signals.py"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/cryptosignals && /var/www/cryptosignals/.venv/bin/python /var/www/cryptosignals/deploy/clear_signals.py'
