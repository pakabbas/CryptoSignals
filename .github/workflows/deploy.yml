name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q
        env:
          TESTING: "true"
          ENABLE_SCHEDULER: "false"
          PYTHONPATH: ${{ github.workspace }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo mkdir -p /var/www/cryptosignals && sudo chown -R "$USER":www-data /var/www/cryptosignals && sudo chmod -R 775 /var/www/cryptosignals'

      - name: Sync application files
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'deploy/firebase-service-account.json' \
            --exclude 'logs/*.log' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ \
            "$SSH_USER@$SSH_HOST:/var/www/cryptosignals/"

      - name: Create crypto_signals database on VM
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo mysql < /var/www/cryptosignals/deploy/init-database.sql'

      - name: Write server environment file
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: |
          ENV_FILE="$(mktemp)"
          {
            echo "FLASK_ENV=production"
            echo "SECRET_KEY=${SECRET_KEY:-change-me-in-production}"
            echo "MYSQL_HOST=${MYSQL_HOST:-localhost}"
            echo "MYSQL_PORT=${MYSQL_PORT:-3306}"
            echo "MYSQL_USER=${MYSQL_USER:-leadpilot}"
            echo "MYSQL_PASSWORD=${MYSQL_PASSWORD:-}"
            echo "MYSQL_DATABASE=${MYSQL_DATABASE:-crypto_signals}"
            echo "TIMEZONE=UTC"
            echo "SCANNER_INTERVAL_SECONDS=60"
            echo "DEFAULT_TIMEFRAME=1H"
            echo "EXCHANGE=kraken"
            echo "LOG_LEVEL=INFO"
            echo "DEBUG_MODE=false"
            echo "ENABLE_SCHEDULER=true"
            echo "ENABLE_PUSH_ALERTS=true"
            echo "ENABLE_EMAIL_ALERTS=false"
            echo "STOP_LOSS_PCT=1.5"
            echo "TAKE_PROFIT_PCT=3.0"
            echo "FIREBASE_SERVICE_ACCOUNT_PATH=/var/www/cryptosignals/deploy/firebase-service-account.json"
          } > "$ENV_FILE"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$ENV_FILE" \
            "$SSH_USER@$SSH_HOST:/var/www/cryptosignals/.env"
          rm -f "$ENV_FILE"

      - name: Install Firebase service account (optional)
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON secret not set; skip (push will not send until configured)"
            exit 0
          fi
          SA_FILE="$(mktemp)"
          printf '%s' "$FIREBASE_SA" > "$SA_FILE"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SA_FILE" \
            "$SSH_USER@$SSH_HOST:/var/www/cryptosignals/deploy/firebase-service-account.json"
          rm -f "$SA_FILE"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'chmod 600 /var/www/cryptosignals/deploy/firebase-service-account.json'

      - name: Upload nginx config and run setup
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/nginx-cryptosignals.conf \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-nginx.conf"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/nginx-cryptosignals-http-only.conf \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-nginx-http.conf"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/remote-setup.sh \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-remote-setup.sh"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/post-deploy.sh \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-post-deploy.sh"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'chmod +x /var/www/cryptosignals/deploy/*.sh 2>/dev/null || true; bash /tmp/cryptosignals-remote-setup.sh'

      - name: Apply exchange setting for GCP
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "/var/www/cryptosignals/.venv/bin/python /var/www/cryptosignals/deploy/apply_exchange_env.py"

      - name: Apply SMTP settings
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_TO_EMAIL: ${{ secrets.SMTP_TO_EMAIL }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "SMTP_HOST='${SMTP_HOST}' SMTP_PORT='${SMTP_PORT}' SMTP_USERNAME='${SMTP_USERNAME}' SMTP_PASSWORD='${SMTP_PASSWORD}' SMTP_FROM_NAME='${SMTP_FROM_NAME}' SMTP_FROM_EMAIL='${SMTP_FROM_EMAIL}' SMTP_TO_EMAIL='${SMTP_TO_EMAIL}' SMTP_USE_TLS='${SMTP_USE_TLS}' /var/www/cryptosignals/.venv/bin/python /var/www/cryptosignals/deploy/apply_smtp_env.py"

      - name: Warm up 7d candle history
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/cryptosignals && HISTORY_WARMUP_DAYS=7 /var/www/cryptosignals/.venv/bin/python /var/www/cryptosignals/deploy/warmup_history.py'

      - name: Apply indicators.md reset (BTC/SOL + clear history)
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/cryptosignals && BASELINE_BACKTEST_DAYS=7 RUN_BASELINE_BACKTESTS=true /var/www/cryptosignals/.venv/bin/python /var/www/cryptosignals/deploy/apply_indicators_reset.py'

      - name: Health check
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          sleep 8
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'curl -fsSL http://127.0.0.1:5000/health | grep -q CryptoSignals'
          curl -4 -fsSL --retry 8 --retry-delay 3 \
            -A "CryptoSignals-Deploy-Check" \
            "https://cryptosignals.btkdeals.com/health" | grep -q CryptoSignals
          echo "Health check passed"
