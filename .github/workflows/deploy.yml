name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.GCP_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure app directory exists
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'sudo mkdir -p /var/www/cryptosignals && sudo chown -R "$USER":www-data /var/www/cryptosignals && sudo chmod -R 775 /var/www/cryptosignals'

      - name: Sync application files
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude 'logs/*.log' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes" \
            ./ \
            "$SSH_USER@$SSH_HOST:/var/www/cryptosignals/"

      - name: Upload nginx config and run setup
        env:
          SSH_HOST: ${{ secrets.GCP_SSH_HOST }}
          SSH_USER: ${{ secrets.GCP_SSH_USER }}
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/nginx-cryptosignals.conf \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-nginx.conf"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/remote-setup.sh \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-remote-setup.sh"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            deploy/post-deploy.sh \
            "$SSH_USER@$SSH_HOST:/tmp/cryptosignals-post-deploy.sh"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'chmod +x /var/www/cryptosignals/deploy/*.sh 2>/dev/null || true; bash /tmp/cryptosignals-remote-setup.sh'

      - name: Health check
        run: |
          sleep 8
          curl -4 -fsSL --retry 8 --retry-delay 3 \
            -A "CryptoSignals-Deploy-Check" \
            "http://cryptosignals.btkdeals.com/" | grep -q "CryptoSignals"
          echo "Health check passed"
