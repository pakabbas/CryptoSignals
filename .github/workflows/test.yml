name: Tests

# PRs only — pushes to main run pytest inside deploy.yml (avoids duplicate Actions runs).
on:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -q
        env:
          TESTING: "true"
          ENABLE_SCHEDULER: "false"
          PYTHONPATH: ${{ github.workspace }}
